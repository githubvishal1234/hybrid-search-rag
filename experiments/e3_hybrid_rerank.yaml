# E3: change one thing from E2b, a cross-encoder reranks the top 30 fused chunks.
name: hybrid_rerank
hypothesis: Higher precision at the top (Hit@1, MRR) because the cross-encoder reads question and passage together; costs ~15 s per query on CPU.
config:
  mode: hybrid_rerank
  dense_top_k: 30
  bm25_top_k: 30
  rrf_k: 10
  rrf_bm25_weight: 2.0
  rerank_candidates: 30
  reranker_provider: local
  reranker_model: BAAI/bge-reranker-base
  context_top_n: 5
