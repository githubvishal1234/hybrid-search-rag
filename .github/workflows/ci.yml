name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Unit tests use fakes for models, Qdrant and the LLM, so CI downloads nothing heavy.
      - run: uv run pytest -q

  docker-build:
    # Catches Dockerfile breakage; the image isn't pushed (indexes aren't in the repo).
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p data/processed  # the Dockerfile copies prebuilt indexes from here
      - run: docker build -t hybrid-rag:ci .
