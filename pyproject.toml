[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Hybrid BM25 + vector RAG with RRF, reranking and cited answers over Indian finance PDFs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Dependencies are added per milestone (uv add <pkg>), so the lockfile only holds what the code uses.
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "huggingface-hub>=0.20",
    "openai>=3.37.0",
    "pydantic-settings>=2.6",
    "pymupdf>=2.0",
    "pystemmer>=3.1.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.66.1",
    "tokenizers>=0.15",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "eval"]  # lets tests import the scripts and eval helpers
